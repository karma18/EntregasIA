name: Comprobar API publicada

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke HTTP de la API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar API
        run: dotnet restore src/Talleres.Api/Talleres.Api.csproj
      - name: Publicar API en Release
        run: >-
          dotnet publish src/Talleres.Api/Talleres.Api.csproj
          --configuration Release --no-restore --output artifacts/publish
      - name: Arrancar API y verificar peticiones HTTP
        id: smoke
        shell: pwsh
        run: ./scripts/run-smoke.ps1 -ApiDirectory artifacts/publish -LogDirectory artifacts/smoke
      - name: Publicar registros del smoke test
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-http
          path: artifacts/smoke/
          if-no-files-found: error
          retention-days: 14
